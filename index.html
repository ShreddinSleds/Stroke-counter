<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="StrokeX">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>StrokeX</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111111;
    color: #f0f0f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
    user-select: none;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 20px) 20px calc(env(safe-area-inset-bottom, 20px) + 12px);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .readout {
    text-align: center;
    margin: 24px 0 20px;
  }
  .label { font-size: 14px; color: #999; letter-spacing: 0.02em; }
  .spm { font-size: 76px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .elapsed { font-size: 16px; color: #888; font-variant-numeric: tabular-nums; }

  #strokeBtn {
    flex: 1;
    min-height: 220px;
    font-size: 26px;
    font-weight: 700;
    border-radius: 24px;
    border: none;
    background: #2563eb;
    color: white;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.05s ease, background 0.1s ease;
  }
  #strokeBtn:active { transform: scale(0.97); background: #1d4ed8; }
  #strokeBtn:disabled { background: #333; color: #666; }

  .controls { display: flex; gap: 12px; margin-bottom: 16px; }
  .controls button {
    flex: 1;
    padding: 16px;
    font-size: 17px;
    font-weight: 600;
    border-radius: 14px;
    border: 1px solid #444;
    background: #1c1c1c;
    color: #f0f0f0;
  }
  .controls button:active { background: #2a2a2a; }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .stat {
    background: #1c1c1c;
    border-radius: 14px;
    padding: 14px;
    text-align: center;
  }
  .stat .stat-label { font-size: 12px; color: #999; margin-bottom: 4px; }
  .stat .stat-value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .icon { width: 30px; height: 30px; }

  .modeToggle {
    display: flex;
    background: #1c1c1c;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 14px;
  }
  .modeBtn {
    flex: 1;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: #999;
  }
  .modeBtn.active { background: #2563eb; color: white; }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .brand-logo {
    width: 36px;
    height: 36px;
    border-radius: 9px;
  }
  .brand-name {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  .sens-panel {
    background: #1c1c1c;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .sens-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sens-panel input[type="range"] {
    width: 100%;
    margin: 8px 0 0;
    accent-color: #2563eb;
  }

  .spm.pulse { color: #22c55e; }
  .spm { transition: color 0.1s ease; }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <img src="icon.png" alt="StrokeX logo" class="brand-logo">
    <span class="brand-name">StrokeX</span>
  </div>

  <div class="readout">
    <div class="label">Strokes per minute</div>
    <div class="spm" id="spm">0</div>
    <div class="elapsed" id="elapsed">00:00</div>
  </div>

  <div class="modeToggle">
    <button id="manualModeBtn" class="modeBtn active">Manual tap</button>
    <button id="autoModeBtn" class="modeBtn">Auto-detect</button>
  </div>

  <button id="strokeBtn" disabled>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 13V4.5a1.5 1.5 0 0 1 3 0V12"/>
      <path d="M11 11.5v-2a1.5 1.5 0 0 1 3 0V12"/>
      <path d="M14 10.5a1.5 1.5 0 0 1 3 0V12"/>
      <path d="M17 11.5a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-2 .208a6 6 0 0 1-5.012-2.7L7 19c-.312-.479-1.407-2.388-3.286-5.728a1.5 1.5 0 0 1 .536-2.022c.966-.578 2.078-.16 2.75.68l1.5 1.87"/>
    </svg>
    <span id="strokeBtnLabel">Tap on stroke</span>
  </button>

  <div id="sensPanel" class="sens-panel" style="display:none;">
    <div class="sens-row">
      <span class="stat-label">Sensitivity</span>
      <span class="stat-label" id="sensValue">Medium</span>
    </div>
    <input type="range" id="sensSlider" min="1" max="5" value="3" step="1">
    <div class="sens-row" style="margin-top:4px;">
      <span class="stat-label" id="motionStatus">Grant motion access to begin</span>
      <span class="stat-label" id="liveMag">--</span>
    </div>
  </div>

  <div class="controls">
    <button id="startStop">Start</button>
    <button id="reset">Reset</button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Total strokes</div>
      <div class="stat-value" id="totalStrokes">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Last interval</div>
      <div class="stat-value" id="lastInterval">--</div>
    </div>
  </div>

</div>

<script>
let running = false;
let startTime = null;
let strokeCount = 0;
let strokeTimes = [];
let timerInterval = null;

const spmEl = document.getElementById('spm');
const elapsedEl = document.getElementById('elapsed');
const strokeBtn = document.getElementById('strokeBtn');
const startStopBtn = document.getElementById('startStop');
const resetBtn = document.getElementById('reset');
const totalStrokesEl = document.getElementById('totalStrokes');
const lastIntervalEl = document.getElementById('lastInterval');

function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
  const s = (totalSec % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

function updateElapsed() {
  if (!running) return;
  elapsedEl.textContent = formatTime(Date.now() - startTime);
}

function computeSPM() {
  const now = Date.now();
  const windowMs = 30000;
  const recent = strokeTimes.filter(t => now - t <= windowMs);
  if (recent.length < 2) {
    if (strokeTimes.length >= 2 && startTime) {
      const elapsedMin = (now - startTime) / 60000;
      if (elapsedMin > 0) spmEl.textContent = Math.round(strokeCount / elapsedMin);
    }
    return;
  }
  const span = (recent[recent.length - 1] - recent[0]) / 1000;
  const rate = span > 0 ? Math.round((recent.length - 1) / span * 60) : 0;
  spmEl.textContent = rate;
}

startStopBtn.addEventListener('click', () => {
  running = !running;
  if (running) {
    if (!startTime) startTime = Date.now();
    strokeBtn.disabled = false;
    startStopBtn.textContent = 'Stop';
    timerInterval = setInterval(updateElapsed, 500);
  } else {
    strokeBtn.disabled = true;
    startStopBtn.textContent = 'Start';
    clearInterval(timerInterval);
  }
});

resetBtn.addEventListener('click', () => {
  running = false;
  startTime = null;
  strokeCount = 0;
  strokeTimes = [];
  clearInterval(timerInterval);
  spmEl.textContent = '0';
  elapsedEl.textContent = '00:00';
  totalStrokesEl.textContent = '0';
  lastIntervalEl.textContent = '--';
  strokeBtn.disabled = true;
  startStopBtn.textContent = 'Start';
});

function registerStroke() {
  const now = Date.now();
  if (strokeTimes.length > 0) {
    const interval = (now - strokeTimes[strokeTimes.length - 1]) / 1000;
    lastIntervalEl.textContent = interval.toFixed(1) + 's';
  }
  strokeTimes.push(now);
  strokeCount++;
  totalStrokesEl.textContent = strokeCount;
  computeSPM();
  if (navigator.vibrate) navigator.vibrate(15);
}

strokeBtn.addEventListener('click', () => {
  if (mode === 'manual') registerStroke();
});

// --- Auto-detect (accelerometer) ---
const manualModeBtn = document.getElementById('manualModeBtn');
const autoModeBtn = document.getElementById('autoModeBtn');
const sensPanel = document.getElementById('sensPanel');
const sensSlider = document.getElementById('sensSlider');
const sensValue = document.getElementById('sensValue');
const motionStatus = document.getElementById('motionStatus');
const liveMag = document.getElementById('liveMag');
const strokeBtnLabel = document.getElementById('strokeBtnLabel');

let mode = 'manual';
let motionActive = false;
let avgMag = 1;
let lastPeakTime = 0;
const sensLabels = { 1: 'Very low', 2: 'Low', 3: 'Medium', 4: 'High', 5: 'Very high' };
const sensThresholds = { 1: 3.5, 2: 2.5, 3: 1.6, 4: 1.0, 5: 0.6 };
// Pump can't exceed 60 strokes/min, so two real strokes are always >=1000ms apart.
// Cooldown stops short of that full 1000ms so natural jitter at max speed
// doesn't cause a real stroke to be silently missed, while still firmly
// rejecting a single stroke's mechanical rebound/ringing.
const sensDebounce = { 1: 700, 2: 750, 3: 800, 4: 850, 5: 900 };

sensSlider.addEventListener('input', () => {
  sensValue.textContent = sensLabels[sensSlider.value];
});

function handleMotion(event) {
  const a = event.accelerationIncludingGravity || event.acceleration;
  if (!a || a.x === null) return;
  const mag = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
  avgMag = avgMag * 0.9 + mag * 0.1;
  const delta = Math.abs(mag - avgMag);
  liveMag.textContent = delta.toFixed(2);

  if (!running) return;

  const threshold = sensThresholds[sensSlider.value];
  const debounce = sensDebounce[sensSlider.value];
  const now = Date.now();

  if (delta > threshold && (now - lastPeakTime) > debounce) {
    lastPeakTime = now;
    registerStroke();
    spmEl.classList.add('pulse');
    setTimeout(() => spmEl.classList.remove('pulse'), 150);
  }
}

async function enableMotion() {
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const result = await DeviceMotionEvent.requestPermission();
      if (result !== 'granted') {
        motionStatus.textContent = 'Motion access denied';
        return;
      }
    } catch (e) {
      motionStatus.textContent = 'Motion access unavailable';
      return;
    }
  }
  if (!('DeviceMotionEvent' in window)) {
    motionStatus.textContent = 'Accelerometer not supported on this device';
    return;
  }
  window.addEventListener('devicemotion', handleMotion);
  motionActive = true;
  motionStatus.textContent = 'Listening for pulses';
}

manualModeBtn.addEventListener('click', () => {
  mode = 'manual';
  manualModeBtn.classList.add('active');
  autoModeBtn.classList.remove('active');
  sensPanel.style.display = 'none';
  strokeBtn.style.display = 'flex';
  strokeBtnLabel.textContent = 'Tap on stroke';
});

autoModeBtn.addEventListener('click', () => {
  mode = 'auto';
  autoModeBtn.classList.add('active');
  manualModeBtn.classList.remove('active');
  sensPanel.style.display = 'block';
  strokeBtn.style.display = 'none';
  if (!motionActive) enableMotion();
});
</script>
</body>
</html>
